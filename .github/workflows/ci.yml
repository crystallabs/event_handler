name: Linux CI

on:
  push:
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      # install-crystal installs packages without refreshing the package
      # index, which fails when the runner image's index has gone stale.
      - name: Update package index
        run: sudo apt-get update -y
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: ${{ runner.os }}-shards-
      - name: Install shards
        run: shards update --ignore-crystal-version
      - name: Run tests
        run: crystal spec --order=random --error-on-warnings
      - name: Check formatting
        run: crystal tool format --check
      - name: Run ameba
        run: |
          shards build ameba
          ./bin/ameba
  release_linux:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest-alpine
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Build binaries
        run: |
          shards update --production --release --static --no-debug --ignore-crystal-version
          crystal build --time --release --static --no-debug -o examples/events examples/events.cr
